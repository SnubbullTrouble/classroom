<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generating Report | Classroom</title>
    <style>
        :root { --ink: #17211b; --muted: #66736a; --green: #1f6f4a; --paper: #f4f1e8; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--ink); background: linear-gradient(135deg, #f6f2e8, #edf2e9); font-family: "Segoe UI", sans-serif; }
        main { width: min(560px, calc(100% - 32px)); padding: 34px; background: rgba(255, 253, 247, .9); border: 1px solid #d9ded5; }
        h1 { margin: 0 0 12px; font: 700 2.5rem/.95 Georgia, "Times New Roman", serif; }
        p { color: var(--muted); line-height: 1.5; }
        .progress { height: 10px; margin: 26px 0 12px; overflow: hidden; background: #d9ded5; }
        .bar { width: 0; height: 100%; background: var(--green); transition: width .3s ease; }
        .status { color: var(--green); font-weight: 700; }
        a { color: var(--green); font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <h1>Generating {{ assignment.name }}.</h1>
        <p>GitHub workflow runs and logs are being collected. This page will open the report when the job finishes.</p>
        <div class="progress"><div class="bar" id="bar"></div></div>
        <p class="status" id="status">Queued...</p>
        <p><a href="/assignments/">Return to assignments</a></p>
    </main>
    <script>
        const bar = document.querySelector("#bar");
        const status = document.querySelector("#status");
        const jobUrl = "/api/report-jobs/{{ job.id }}/";

        async function poll() {
            const response = await fetch(jobUrl, { headers: { "Accept": "application/json" } });
            const job = await response.json();
            const total = Number(job.total_items || 0);
            const completed = Number(job.completed_items || 0);
            const percent = total ? Math.round(completed / total * 100) : 0;
            bar.style.width = `${percent}%`;
            status.textContent = job.status === "running" ? `Collected ${completed} of ${total} repositories` : `${job.status}...`;
            if (job.status === "completed") {
                window.location.reload();
                return;
            }
            if (job.status === "failed") {
                status.textContent = job.error_message || "Report generation failed.";
                return;
            }
            window.setTimeout(poll, 1500);
        }

        poll().catch(() => { status.textContent = "Unable to read report job status."; });
    </script>
</body>
</html>
