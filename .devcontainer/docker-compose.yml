services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.13-bookworm
    environment:
      CLAUDE_CONFIG_DIR: /home/vscode/.claude-persist
      HISTFILE: /home/vscode/.shell-history/.bash_history
    volumes:
      - ../..:/workspaces:cached
      # Keeps Claude Code's login and settings across container rebuilds.
      - claude-config:/home/vscode/.claude-persist
      # Keeps terminal command history across container rebuilds.
      - shell-history:/home/vscode/.shell-history
    command: sleep infinity
    # service_started, not service_healthy: Codespaces rebuilds with
    # `up --no-recreate`, which reuses an existing redis container even if it
    # predates the healthcheck below, and service_healthy then fails the whole
    # build. Nothing at startup needs Redis ready, only running (for network_mode).
    depends_on:
      redis:
        condition: service_started
    # Share Redis's network namespace so the defaults in .env.example
    # (redis://127.0.0.1:6379/0) work unchanged.
    network_mode: service:redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

volumes:
  redis-data:
  claude-config:
  shell-history:
